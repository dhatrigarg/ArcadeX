<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Memory Game</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../RockPaperScissors/rpsStyles.css">
    <link rel="stylesheet" href="memory.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../images/logo.png" alt="ArcadeX Logo">
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
        </div>
    </nav>
    <h3><span class="first">THE</span>
        <span class="second">MEMORY</span>
        <span class="third">GAME</span></h3>
    
        
        <p class="features-sub" id="features-sub-one">Flip. Think. Match.</p>
        <p class="features-sub" id="features-sub-two">A simple game with a powerful memory challenge.</p>
        
        <section class="container">
            <div class="box left">
            <div class="sideHeading">
                <span><i class="fa-solid fa-question" style="color:#A855F7;"></i></span><span>  HOW TO PLAY</span>
            </div>
            <div class="points">
                <p>🃏 Flip two cards.</p>
                <p>🧠 Remember the match.</p>
                <p>🏆 Clear all pairs.</p>
            </div>
        </div>
        <div class="box center">
            <h3 class="grad-text" id="featuresMain">Play the game</h3> 
            <button class="btn"><i class="fa-solid fa-play"></i> Start Game</button>
            <div class="grid">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </div>
        <div class="box right">
            <div class="sideHeading">
                <span><i class="fa-solid fa-trophy" style="color:#A855F7;"></i></span><span>  YOUR SCORE</span>
            </div>
            <div class="points" id="rightPoints">
                <p>🃏 Pairs Found : <span id="Pairs" class="first">0</span></p>
                <p>⏱️ Time : <span id="Time" class="second">0:00</span></p>
                <p>👣 Moves Taken : <span id="Moves" class="third">0</span></p>
            </div>
        </div>
    </section>

    <script src="memory.js"></script>
</div>
</body>
</html>
